<!doctype html>
<html data-bs-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#15181d">
  <meta name="robots" content="noindex,nofollow,noarchive,nosnippet">
  <title>MyCouch</title>
  <script>
    (function(){
      try {
        var t = localStorage.getItem("mycouch-theme") || localStorage.getItem("librarylens-theme");
        if (t === "light" || t === "dark") document.documentElement.setAttribute("data-bs-theme", t);
      } catch(e) {}
    })();
  </script>
  <link rel="manifest" href="/static/manifest.webmanifest">
  <link rel="apple-touch-icon" href="/static/pwa-192.png">
  <link rel="icon" type="image/png" href="/static/pwa-192.png">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="/static/app.css?v=2.9.14-security-login">
</head>
<body>
  <main class="min-vh-100 d-flex align-items-center">
    <div class="container-fluid px-4 py-4">
      {% with messages = get_flashed_messages(with_categories=true) %}
        {% for category, message in messages %}
        <div class="alert alert-{{ category }} alert-dismissible fade show mx-auto" style="max-width:760px" role="alert">
          {{ message }}<button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>
        {% endfor %}
      {% endwith %}
      {% block content %}{% endblock %}
    </div>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
