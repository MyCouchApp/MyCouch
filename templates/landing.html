{% extends 'public_base.html' %}{% block content %}
<div class="row justify-content-center py-5"><div class="col-lg-8 col-xl-6">
  <div class="card border-0 shadow-sm"><div class="card-body p-4 p-md-5 text-center">
    <img src="/static/mascots/mycouch-logo.png" alt="MyCouch" style="width:150px;max-width:45%;height:auto" class="mb-4">
    <div class="text-uppercase small fw-semibold text-secondary mb-2">Your media. Your history. What's next?</div>
