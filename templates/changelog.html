{% extends "base.html" %}{% block content %}
<div class="d-flex justify-content-between align-items-end mb-4"><div><h1 class="mb-1">Changelog</h1><div class="text-secondary">MyCouch release history</div></div><span class="badge text-bg-warning fs-6">Current: v{{ app_version }}</span></div>
<div class="row"><div class="col-xl-9 col-lg-11">
{% for version, changes in versions %}
<div class="card mb-3"><div class="card-body"><div class="d-flex gap-3 align-items-start"><span class="badge {% if loop.first %}text-bg-warning{% else %}text-bg-secondary{% endif %} fs-6">{{ version }}</span><div>{{ changes }}</div></div></div></div>
{% endfor %}
</div></div>
{% endblock %}
