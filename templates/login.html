{% extends "base.html" %}{% block content %}
<div class="row justify-content-center"><div class="col-md-6 col-lg-4"><div class="card"><div class="card-body p-4"><h1 class="h3 mb-3">Admin login</h1><p class="text-secondary">Public pages remain read-only. Sign in to manage settings, scans, review items and integrations.</p><form method="post"><input type="hidden" name="_csrf" value="{{csrf_token()}}"><div class="mb-3"><label class="form-label">Username</label><input class="form-control" name="username" autocomplete="username" required></div><div class="mb-3"><label class="form-label">Password</label><input class="form-control" type="password" name="password" autocomplete="current-password" required></div><div class="form-check mb-3"><input class="form-check-input" type="checkbox" name="remember" value="1" id="rememberMe" checked><label class="form-check-label" for="rememberMe">Remember me on this browser</label></div><button class="btn btn-primary w-100">Log in</button></form></div></div></div></div>
{% endblock %}
