services:
  mycouch:
    build: .
    container_name: mycouch
    restart: unless-stopped
    command: ["python", "production.py"]
    ports:
      - "${MYCOUCH_HOST_PORT:-8090}:8090"
    environment:
      TZ: "${TZ:-UTC}"
      PORT: "8090"
      MYCOUCH_DATA_DIR: /app/data
      MYCOUCH_SECURE_COOKIE: "1"
      PLEX_DB: /plex-db/com.plexapp.plugins.library.db
      PLEX_BACKUP_DIR: "${PLEX_BACKUP_DIR:-}"
    volumes:
      - ./data:/app/data
